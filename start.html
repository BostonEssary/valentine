<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click to Begin</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .play-button {
            padding: 20px 40px;
            font-size: 24px;
            cursor: pointer;
            background-color: #ff69b4;
            border: none;
            border-radius: 50px;
            color: white;
            transition: transform 0.3s ease;
        }
        .play-button:hover {
            transform: scale(1.1);
        }
        .sound-disclaimer {
            position: absolute;
            top: 30%;
            text-align: center;
            font-size: 18px;
            color: #ff69b4;
            animation: float 2s ease-in-out infinite;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.2);
        }
        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
            100% {
                transform: translateY(0px);
            }
        }
        .sound-icon {
            font-size: 24px;
            margin-bottom: 8px;
            display: block;
        }
    </style>
    <!-- Include any styles from why-i-love-you.html -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="content">
        <div class="sound-disclaimer">
            <span class="sound-icon">🎵</span>
            Please turn on your sound<br>
            for the best experience ♥
        </div>
        <button class="play-button" id="startButton">Click to Begin ♥</button>
    </div>
    <audio id="backgroundMusic" src="assets/billie.mp3"></audio>

    <script src="start-script.js"></script>
</body>
</html>
